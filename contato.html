      <nav class="nav-desktop" aria-label="Principal">

        @salnalente
      </a>
      <span>salnalente.com.br</span>
    </div>
  </footer>

  <script>
    const INSTAGRAM = 'https://instagram.com/salnalente';
    const WHATSAPP = '5521999485532';
    const MSG = 'Olá! Quero agendar uma sessão de fotos com Sal na Lente.';

    document.getElementById('ig-link').href = INSTAGRAM;
    document.getElementById('wa-cta').href =
      `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(MSG)}`;

    const menuToggle = document.getElementById('menuToggle');
    const navMobile = document.getElementById('navMobile');

    function closeMenu() {
      menuToggle.setAttribute('aria-expanded', 'false');
      menuToggle.setAttribute('aria-label', 'Abrir menu');
      navMobile.classList.remove('open');
      navMobile.hidden = true;
      document.body.classList.remove('menu-open');
    }

    function openMenu() {
      menuToggle.setAttribute('aria-expanded', 'true');
      menuToggle.setAttribute('aria-label', 'Fechar menu');
      navMobile.hidden = false;
      navMobile.classList.add('open');
      document.body.classList.add('menu-open');
    }

    menuToggle.addEventListener('click', () => {
      const isOpen = menuToggle.getAttribute('aria-expanded') === 'true';
      if (isOpen) closeMenu();
      else openMenu();
    });

    navMobile.querySelectorAll('a').forEach((link) => {
      link.addEventListener('click', closeMenu);
    });
  </script>
</body>
</html>
