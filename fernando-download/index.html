<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sal na Lente — Download</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LRCVR4REXH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-LRCVR4REXH');
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,700;1,400&display=swap');

    :root {
      --ocean: #000000;
      --foam: #ffffff;
      --salt: #6b7f8a;
      --accent: #e8c87a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--ocean);
      color: var(--foam);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    header {
      padding: 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: center;
    }

    .logo-img {
      height: 100px;
      width: auto;
    }

    @media (min-width: 768px) {
      .logo-img { height: 160px; }
    }

    .instruction {
      padding: 1rem 1.5rem;
      background: rgba(255,255,255,0.04);
      border-left: 3px solid var(--accent);
      margin: 1rem 0;
      font-size: 0.875rem;
      color: var(--salt);
      line-height: 1.6;
    }

    .instruction strong {
      color: var(--foam);
      display: block;
      margin-bottom: 0.2rem;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      gap: 28px;
      padding: 0 32px 4rem;
      align-items: center;
    }

    @media (min-width: 768px) {
      .gallery { padding: 0 0 4rem; }
    }

    .photo-card {
      width: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    @media (min-width: 768px) {
      .photo-card { width: 50%; }
    }

    .photo-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .photo-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .photo-name {
      font-size: 0.75rem;
      color: var(--salt);
      word-break: break-all;
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      flex-shrink: 0;
      background: var(--accent);
      color: #111;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.7rem 1.1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: filter 0.2s, opacity 0.2s;
      min-height: 44px;
    }

    .btn-download:hover { filter: brightness(1.05); }

    .btn-download[aria-disabled="true"] {
      opacity: 0.4;
      pointer-events: none;
    }

    .btn-download svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .empty {
      padding: 3rem 1.5rem;
      text-align: center;
      color: var(--salt);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 2rem 1.5rem;
      font-size: 0.75rem;
      color: rgba(107,127,138,0.4);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

<header>
  <img src="../logo.png" alt="Sal na Lente" class="logo-img" />
</header>

<div class="instruction">
  <strong>Tudo pronto, baixe aqui suas mídias em alta resolução</strong>
  Toque no botão download em cada foto para salvar suas mídias
</div>

<div class="gallery" id="gallery"></div>

<footer>salnalente.com.br</footer>

<script>
  const gallery = document.getElementById('gallery');

  /**
   * Aceita o link de visualização do Drive e devolve o de download direto.
   * Ex.: .../file/d/ID/view?usp=...  →  .../uc?export=download&id=ID
   */
  function toDriveDownloadUrl(url) {
    if (!url || typeof url !== 'string') return '';

    const trimmed = url.trim();
    if (!trimmed) return '';

    if (/[?&]export=download\b/.test(trimmed) && /[?&]id=/.test(trimmed)) {
      return trimmed;
    }

    const fileMatch = trimmed.match(/\/file\/d\/([^/]+)/);
    if (fileMatch) {
      return `https://drive.google.com/uc?export=download&id=${fileMatch[1]}`;
    }

    const idMatch = trimmed.match(/[?&]id=([^&]+)/);
    if (idMatch) {
      return `https://drive.google.com/uc?export=download&id=${idMatch[1]}`;
    }

    return trimmed;
  }

  function renderEmpty(message) {
    gallery.innerHTML = `<p class="empty">${message}</p>`;
  }

  fetch('downloads.json')
    .then(r => {
      if (!r.ok) throw new Error('missing');
      return r.json();
    })
    .then(items => {
      if (!Array.isArray(items) || items.length === 0) {
        renderEmpty('Nenhuma foto disponível no momento.<br>Se você acabou de pagar, me avise no WhatsApp.');
        return;
      }

      items.forEach((item) => {
        const preview = item.preview || item.file || '';
        const downloadUrl = toDriveDownloadUrl(item.drive || item.download || '');

        const card = document.createElement('article');
        card.className = 'photo-card';

        const img = document.createElement('img');
        img.src = `fotos/${preview}`;
        img.alt = preview;
        img.loading = 'lazy';
        img.draggable = false;

        const meta = document.createElement('div');
        meta.className = 'photo-meta';

        const name = document.createElement('span');
        name.className = 'photo-name';
        name.textContent = preview;

        const btn = document.createElement('a');
        btn.className = 'btn-download';
        btn.innerHTML = `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
          </svg>
          Download
        `;

        if (downloadUrl) {
          btn.href = downloadUrl;
          btn.setAttribute('download', '');
          btn.rel = 'noopener noreferrer';
          btn.addEventListener('click', () => {
            if (typeof gtag === 'function') {
              gtag('event', 'file_download', {
                file_name: preview,
                link_url: downloadUrl,
                page_path: window.location.pathname
              });
            }
          });
        } else {
          btn.href = '#';
          btn.setAttribute('aria-disabled', 'true');
          btn.title = 'Link do Drive ainda não configurado';
        }

        meta.appendChild(name);
        meta.appendChild(btn);
        card.appendChild(img);
        card.appendChild(meta);
        gallery.appendChild(card);
      });
    })
    .catch(() => {
      renderEmpty('Nenhuma foto disponível no momento.');
    });
</script>

</body>
</html>
