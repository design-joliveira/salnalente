<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sal na Lente — Galeria</title>
  <link rel="stylesheet" href="site.css" />
</head>
<body>

  <header class="top">
    <div class="wrap-header">
      <a class="logo-link" href="index.html" aria-label="Sal na Lente — início">
        <img src="logo-site.png" alt="Sal na Lente" class="logo-img" />
      </a>

      <nav class="nav-desktop" aria-label="Principal">
        <a href="index.html">home</a>
        <a href="sessoes.html">sessões</a>
        <a href="galeria.html" aria-current="page">galeria</a>
        <a href="sobre.html">sobre</a>
        <a href="contato.html">contato</a>
      </nav>

      <button
        class="menu-toggle"
        id="menuToggle"
        type="button"
        aria-label="Abrir menu"
        aria-expanded="false"
        aria-controls="navMobile"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <nav class="nav-mobile" id="navMobile" aria-label="Menu mobile" hidden>
      <a href="index.html">home</a>
      <a href="sessoes.html">sessões</a>
      <a href="galeria.html" aria-current="page">galeria</a>
      <a href="sobre.html">sobre</a>
      <a href="contato.html">contato</a>
    </nav>
  </header>

  <section class="gallery-block">
    <div class="wrap">
      <h2 class="section-title">Quadros</h2>
      <div class="gallery gallery--home" data-gallery data-src="galeria/quadros"></div>
    </div>
  </section>

  <hr class="gallery-divider" />

  <section class="gallery-block">
    <div class="wrap">
      <h2 class="section-title">Beach vibes</h2>
      <div class="gallery gallery--home" data-gallery data-src="galeria/beach-vibes"></div>
    </div>
  </section>

  <hr class="gallery-divider" />

  <section class="gallery-block">
    <div class="wrap">
      <h2 class="section-title">Surf</h2>
      <div class="gallery gallery--home" data-gallery data-src="galeria/surf"></div>
    </div>
  </section>

  <footer class="site-foot">
    <div class="wrap">
      <a class="ig-link" href="https://instagram.com/salnalente" target="_blank" rel="noopener" id="ig-link">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
        @salnalente
      </a>
      <span>© 2026 Sal na lente. All rights reserved.</span>
    </div>
  </footer>

  <div
    class="lightbox"
    id="lightbox"
    hidden
    role="dialog"
    aria-modal="true"
    aria-label="Foto ampliada"
  >
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Fechar">
      &times;
    </button>
    <img id="lightboxImg" src="" alt="" />
  </div>

  <script>
    const INSTAGRAM = 'https://instagram.com/salnalente';

    document.getElementById('ig-link').href = INSTAGRAM;

    const menuToggle = document.getElementById('menuToggle');
    const navMobile = document.getElementById('navMobile');

    function closeMenu() {
      menuToggle.setAttribute('aria-expanded', 'false');
      menuToggle.setAttribute('aria-label', 'Abrir menu');
      navMobile.classList.remove('open');
      navMobile.hidden = true;
      document.body.classList.remove('menu-open');
    }

    function openMenu() {
      menuToggle.setAttribute('aria-expanded', 'true');
      menuToggle.setAttribute('aria-label', 'Fechar menu');
      navMobile.hidden = false;
      navMobile.classList.add('open');
      document.body.classList.add('menu-open');
    }

    menuToggle.addEventListener('click', () => {
      const isOpen = menuToggle.getAttribute('aria-expanded') === 'true';
      if (isOpen) closeMenu();
      else openMenu();
    });

    navMobile.querySelectorAll('a').forEach((link) => {
      link.addEventListener('click', closeMenu);
    });

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');

    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.hidden = false;
      requestAnimationFrame(() => lightbox.classList.add('open'));
      document.body.classList.add('lightbox-open');
      lightboxClose.focus();
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.classList.remove('lightbox-open');
      const onEnd = () => {
        lightbox.hidden = true;
        lightboxImg.removeAttribute('src');
        lightbox.removeEventListener('transitionend', onEnd);
      };
      lightbox.addEventListener('transitionend', onEnd);
    }

    lightboxClose.addEventListener('click', (e) => {
      e.stopPropagation();
      closeLightbox();
    });

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.classList.contains('open')) {
        closeLightbox();
      }
    });

    function fillGallery(el, files, basePath) {
      files.forEach((file) => {
        const src = `${basePath}/fotos/${file}`;
        const item = document.createElement('div');
        item.className = 'photo';
        item.setAttribute('role', 'button');
        item.setAttribute('tabindex', '0');
        item.setAttribute('aria-label', 'Ampliar foto');
        item.innerHTML = `<img src="${src}" alt="" draggable="false" loading="lazy" />`;
        item.addEventListener('click', () => openLightbox(src));
        item.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openLightbox(src);
          }
        });
        el.appendChild(item);
      });
    }

    const galleries = document.querySelectorAll('[data-gallery]');
    const sources = [...new Set([...galleries].map((g) => g.dataset.src || 'home'))];

    Promise.all(
      sources.map((src) =>
        fetch(`${src}/fotos.json`)
          .then((r) => {
            if (!r.ok) throw new Error('missing');
            return r.json();
          })
          .then((files) => [src, files])
          .catch(() => [src, null])
      )
    ).then((entries) => {
      const bySrc = Object.fromEntries(entries);
      galleries.forEach((el) => {
        const base = el.dataset.src || 'home';
        const files = bySrc[base];
        if (!Array.isArray(files) || files.length === 0) return;
        fillGallery(el, files, base);
      });
    });

    document.addEventListener('contextmenu', (e) => {
      if (e.target.closest('.gallery') || e.target.closest('.lightbox')) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
